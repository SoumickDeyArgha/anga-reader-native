name: Build Manga Reader APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    name: Build native Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .github/.java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Manga Reader release tag
        id: release
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          echo "tag=v${VERSION}-manga-reader.1" >> "$GITHUB_OUTPUT"
          echo "name=Manga Reader v${VERSION}-manga-reader.1" >> "$GITHUB_OUTPUT"

      - name: Build the FOSS APK
        run: ./gradlew assembleFoss

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: manga-reader-foss-apk
          path: app/build/outputs/apk/foss/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish universal APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          body: |
            Native Android build based on the Mihon Apache-2.0 codebase.

            Download `app-universal-foss.apk` for a device-independent install package. The app contains no content; add only extension repositories and sources you are permitted to use.
          files: app/build/outputs/apk/foss/app-universal-foss.apk
          fail_on_unmatched_files: true
          overwrite_files: true
