name: Sync Mihon Release and Publish

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-release:
    name: Detect and sync a new Mihon release
    runs-on: ubuntu-24.04
    outputs:
      update_available: ${{ steps.upstream.outputs.update_available }}
    steps:
      - name: Check out Manga Reader
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Mihon's latest stable release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/mihonapp/mihon/releases/latest --jq .tag_name)
          CURRENT=$(cat .github/manga-reader-upstream.txt)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "update_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when the fork is already current
        if: steps.upstream.outputs.update_available != 'true'
        run: echo "Manga Reader already tracks Mihon ${{ steps.upstream.outputs.current }}."

      - name: Merge the upstream release into main
        if: steps.upstream.outputs.update_available == 'true'
        env:
          LATEST: ${{ steps.upstream.outputs.latest }}
        run: |
          git config user.name "Manga Reader Update Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add mihon-upstream https://github.com/mihonapp/mihon.git 2>/dev/null || git remote set-url mihon-upstream https://github.com/mihonapp/mihon.git
          git fetch mihon-upstream "refs/tags/$LATEST:refs/tags/$LATEST"
          git merge --no-edit "refs/tags/$LATEST"
          printf '%s\n' "$LATEST" > .github/manga-reader-upstream.txt
          git add .github/manga-reader-upstream.txt
          git commit -m "chore: sync Mihon $LATEST"
          git push origin HEAD:main

  build-and-release:
    name: Build and publish Manga Reader
    needs: sync-release
    if: needs.sync-release.outputs.update_available == 'true'
    uses: ./.github/workflows/manga-reader-build.yml
    permissions:
      contents: write
